name: HengeLinux
options:
  bundleIdPrefix: io.hengelinux
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    CLANG_C_LANGUAGE_STANDARD: c11
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    HV_TLB_PAGE_BITS: "12"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "HV_TLB_PAGE_BITS=$(HV_TLB_PAGE_BITS)"
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../host"
      - "$(SRCROOT)/../.upstream/WindowsiOS/core"
      - "$(SRCROOT)/../.upstream/WindowsiOS/host"
      - "$(SRCROOT)/../.upstream/WindowsiOS/devices"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/include"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/include/slirp"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/include/glib-2.0"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/lib/glib-2.0/include"

targets:
  HengeLinuxJITExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JITExtension
        excludes:
          - Info.plist
          - HengeLinuxJITExtension.entitlements
    info:
      path: JITExtension/Info.plist
      properties:
        CFBundleDisplayName: HengeLinux JIT Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ar.viewer
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).JITExtensionHandler
    entitlements:
      path: JITExtension/HengeLinuxJITExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.hengelinux.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hengelinux.app.jit-extension
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Frameworks"

  HengeLinux:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: HengeLinux Disk & Firmware Image
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.hengelinux.hvsparse
              - public.data
              - public.item
          - CFBundleTypeName: Apple Device Pairing Record
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.hengelinux.mobiledevicepairing
              - com.apple.property-list
              - public.xml
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.hengelinux.hvsparse
            UTTypeDescription: HengeLinux Sparse Disk & UEFI Firmware Image
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hvsparse
                - fd
                - img
          - UTTypeIdentifier: io.hengelinux.mobiledevicepairing
            UTTypeDescription: Apple Device Lockdown Pairing Record
            UTTypeConformsTo:
              - com.apple.property-list
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
                - plist
    entitlements:
      path: HengeLinux.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - group.io.hengelinux.shared
    dependencies:
      - target: HengeLinuxJITExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hengelinux.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HengeLinux-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios"
          - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lhengelinux"
          - "-lslirp"
          - "-lglib-2.0"
          - "-lintl"
          - "-lpcre2-8"
          - "-lffi"
          - "-lresolv"
          - "-liconv"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "SafariServices"
          - "-framework"
          - "GameController"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Arch Linux guest audio capture uses the iOS microphone when requested by guest applications."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    frameworks:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: SafariServices.framework
      - sdk: GameController.framework
