name: HengeLinux
options:
  bundleIdPrefix: io.hengelinux
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    CLANG_C_LANGUAGE_STANDARD: c11
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    GENERATE_INFOPLIST_FILE: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "HV_TLB_PAGE_BITS=12"
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../host"
      - "$(SRCROOT)/../.upstream/WindowsiOS/core"
      - "$(SRCROOT)/../.upstream/WindowsiOS/host"
      - "$(SRCROOT)/../.upstream/WindowsiOS/devices"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/include"
      - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/include/slirp"

targets:
  HengeLinuxJITExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: JITExtension
        excludes:
          - Info.plist
    info:
      path: JITExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hengelinux.app.jit-extension
        GENERATE_INFOPLIST_FILE: NO

  HengeLinux:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: HengeLinux.entitlements
    dependencies:
      - target: HengeLinuxJITExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hengelinux.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HengeLinux-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios"
          - "$(SRCROOT)/../.upstream/WindowsiOS/ios/deps/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lhengelinux"
          - "-lslirp"
          - "-lglib-2.0"
          - "-lintl"
          - "-lpcre2-8"
          - "-lffi"
          - "-lresolv"
          - "-liconv"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Arch Linux guest audio capture uses the iOS microphone when requested by guest applications."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    frameworks:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: SafariServices.framework
      - sdk: GameController.framework
