name: Prebuilt Arch Linux Guest Image

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'guest/**'
      - 'scripts/build_prebuilt_archlinux_arm64.sh'
      - 'tools/hvsparse.c'
      - '.github/workflows/prebuilt-guest-image.yml'

concurrency:
  group: prebuilt-guest-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-guest-image:
    name: Build & Publish archlinux.hvsparse + EDK2 Firmware (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    concurrency:
      group: release-latest-ipa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install disk & UEFI provisioning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dosfstools \
            e2fsprogs \
            fdisk \
            gdisk \
            libarchive-tools \
            mount \
            mtools \
            parted \
            qemu-efi-aarch64 \
            tar \
            util-linux \
            xz-utils \
            zstd
          sudo apt-get install -y --no-install-recommends systemd-boot-efi || true
      - name: Build code.fd, vars.fd, and archlinux.hvsparse
        run: bash scripts/build_prebuilt_archlinux_arm64.sh
      - name: Upload prebuilt guest image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HengeLinux-archlinux-arm64-guest
          path: |
            build/prebuilt/code.fd
            build/prebuilt/vars.fd
            build/prebuilt/archlinux.hvsparse
            build/prebuilt/SHA256SUMS.txt
      - name: Attach code.fd, vars.fd, and archlinux.hvsparse to latest-ipa Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-ipa >/dev/null 2>&1; then
            gh release upload latest-ipa \
              build/prebuilt/code.fd \
              build/prebuilt/vars.fd \
              build/prebuilt/archlinux.hvsparse \
              build/prebuilt/SHA256SUMS.txt \
              --clobber
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            gh release create latest-ipa \
              build/prebuilt/code.fd \
              build/prebuilt/vars.fd \
              build/prebuilt/archlinux.hvsparse \
              build/prebuilt/SHA256SUMS.txt \
              --title "HengeLinux Unsigned IPA & Arch Linux Guest Image (${SHORT_SHA})" \
              --notes "Pre-built Arch Linux ARM64 guest image (\`archlinux.hvsparse\`, \`code.fd\`, \`vars.fd\`) and unsigned iOS bundle." \
              --target main \
              --prerelease
          fi
