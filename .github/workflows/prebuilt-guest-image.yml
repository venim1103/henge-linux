name: Prebuilt Arch Linux Guest Image

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'guest/**'
      - 'scripts/build_prebuilt_archlinux_arm64.sh'
      - 'tools/hvsparse.c'
      - '.github/workflows/prebuilt-guest-image.yml'

concurrency:
  group: prebuilt-guest-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-guest-image:
    name: Build & Publish archlinux.hvsparse + EDK2 Firmware (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install disk & UEFI provisioning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dosfstools \
            e2fsprogs \
            fdisk \
            gdisk \
            ipxe-qemu \
            libarchive-tools \
            mount \
            mtools \
            parted \
            qemu-efi-aarch64 \
            qemu-system-aarch64 \
            qemu-system-arm \
            systemd-boot-efi \
            systemd-ukify \
            python3-pefile \
            tar \
            util-linux \
            xz-utils \
            zstd
          dpkg-query -W -f='${Package}=${Version}\n' binutils dosfstools e2fsprogs gdisk mtools parted qemu-efi-aarch64 qemu-system-aarch64 systemd-boot-efi || true
      - name: Build code.fd, vars.fd, and archlinux.hvsparse
        env:
          VERIFY_BOOT: "1"
        run: bash scripts/build_prebuilt_archlinux_arm64.sh
      - name: Upload prebuilt guest image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HengeLinux-archlinux-arm64-guest
          path: |
            build/prebuilt/code.fd
            build/prebuilt/vars.fd
            build/prebuilt/archlinux.hvsparse
            build/prebuilt/SHA256SUMS.txt
      - name: Attach code.fd, vars.fd, and archlinux.hvsparse to latest-ipa Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          for attempt in 1 2 3 4 5; do
            if gh release view latest-ipa >/dev/null 2>&1; then
              if gh release upload latest-ipa \
                build/prebuilt/code.fd \
                build/prebuilt/vars.fd \
                build/prebuilt/archlinux.hvsparse \
                build/prebuilt/SHA256SUMS.txt \
                --clobber; then
                exit 0
              fi
            else
              if gh release create latest-ipa \
                build/prebuilt/code.fd \
                build/prebuilt/vars.fd \
                build/prebuilt/archlinux.hvsparse \
                build/prebuilt/SHA256SUMS.txt \
                --title "HengeLinux Unsigned IPA & Arch Linux Guest Image (${SHORT_SHA})" \
                --notes "Pre-built Arch Linux ARM64 guest image (\`archlinux.hvsparse\`, \`code.fd\`, \`vars.fd\`) and unsigned iOS bundle." \
                --target main \
                --prerelease; then
                exit 0
              fi
            fi
            echo "Retrying latest-ipa guest asset upload (attempt ${attempt}/5)..."
            sleep $((attempt * 3))
          done
          echo "ERROR: Failed to publish prebuilt guest image assets to latest-ipa after 5 attempts." >&2
          exit 1
