name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, 'mcp-ci-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core-tests:
    name: Core & Platform Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run 4 KiB TLB compatibility tests & build hvsparse
        run: make HV_TLB_PAGE_BITS=12 test-core hvsparse
      - name: Verify hvsparse pack/unpack round-trip and HVSPARSE stream format
        run: |
          python3 -c '
          import struct
          data = b"\x00" * 65536 + b"ARCH_LINUX_AARCH64" + b"\x00" * (131072 - 18) + b"\xff" * 4096
          open("build/raw.bin", "wb").write(data)
          '
          ./build/hvsparse pack build/raw.bin build/test.hvsparse
          python3 -c '
          import struct
          blob = open("build/test.hvsparse", "rb").read()
          magic, vsize = struct.unpack("<8sQ", blob[:16])
          assert magic == b"HVSPARSE", f"unexpected magic: {magic!r}"
          assert vsize == 65536 + 131072 + 4096, f"unexpected vsize: {vsize}"
          assert blob.endswith(b"\x00" * 16), "missing {0,0} extent terminator"
          '
          ./build/hvsparse unpack build/test.hvsparse build/unpacked.bin
          cmp build/raw.bin build/unpacked.bin
      - name: Run 16 KiB TLB fast-path tests
        run: make clean && make HV_TLB_PAGE_BITS=14 test-core hvsparse
      - name: Validate guest bridge, upstream patcher, & provisioning scripts
        run: |
          python3 -m py_compile guest/henge-xdg-open scripts/apply_upstream_patches.py
          bash -n guest/setup-arch-bridge.sh
          bash -n scripts/sync_upstream.sh
          bash -n scripts/build_ios_deps.sh
          bash -n scripts/provision_archlinux_arm64.sh
          bash -n scripts/build_prebuilt_archlinux_arm64.sh
          bash scripts/provision_archlinux_arm64.sh --dry-run
          bash scripts/build_prebuilt_archlinux_arm64.sh --dry-run
          bash scripts/sync_upstream.sh

  ios-build:
    name: iOS Unsigned IPA Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 26 toolchain if installed
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version | tee .xcode-version
      - name: Install XcodeGen & iOS static dependency build tools
        run: brew install xcodegen meson ninja pkg-config
      - name: Sync & patch upstream WindowsiOS engine
        run: bash scripts/sync_upstream.sh
      - name: Restore cached iOS static dependencies (libffi, glib, libslirp)
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # @actions/cache 6.2.0
        with:
          path: .upstream/WindowsiOS/ios/deps
          key: ios-arm64-deps-${{ runner.os }}-${{ hashFiles('.xcode-version', 'scripts/sync_upstream.sh', 'scripts/build_ios_deps.sh') }}
      - name: Build or validate iOS static dependencies (libffi, glib, libslirp)
        run: bash scripts/build_ios_deps.sh
      - name: Run macOS platform tests & build full ios-lib
        run: make REQUIRE_UPSTREAM=1 test-core hvsparse ios-lib
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned iphoneos bundle and package .ipa
        run: |
          xcodebuild \
            -project ios/HengeLinux.xcodeproj \
            -scheme HengeLinux \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_BUNDLE="build/DerivedData/Build/Products/Release-iphoneos/HengeLinux.app"
          EXT_PLIST="$APP_BUNDLE/PlugIns/HengeLinuxJITExtension.appex/Info.plist"
          python3 -c '
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              pl = plistlib.load(f)
          ext = pl.get("NSExtension") or {}
          assert ext.get("NSExtensionPointIdentifier") == "com.apple.ar.viewer", f"bad NSExtensionPointIdentifier: {ext}"
          assert str(ext.get("NSExtensionPrincipalClass", "")).endswith(".JITExtensionHandler"), f"bad NSExtensionPrincipalClass: {ext}"
          assert pl.get("CFBundleVersion"), f"missing CFBundleVersion: {pl}"
          assert pl.get("CFBundleShortVersionString"), f"missing CFBundleShortVersionString: {pl}"
          print("[verify] HengeLinuxJITExtension Info.plist valid:", ext)
          ' "$EXT_PLIST"
          mkdir -p build/ipa/Payload
          cp -R "$APP_BUNDLE" build/ipa/Payload/
          (cd build/ipa && zip -qr ../HengeLinux-unsigned.ipa Payload)
          shasum -a 256 build/HengeLinux-unsigned.ipa > build/HengeLinux-unsigned.ipa.sha256
          ls -lh build/HengeLinux-unsigned.ipa
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HengeLinux-unsigned-ipa
          path: |
            build/HengeLinux-unsigned.ipa
            build/HengeLinux-unsigned.ipa.sha256

  release-ipa:
    name: Publish Rolling latest-ipa Pre-Release
    needs: [core-tests, ios-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-latest-ipa
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HengeLinux-unsigned-ipa
          path: build
      - name: Publish rolling latest-ipa GitHub Pre-Release on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="Automated unsigned iOS build from \`main\` (\`${SHORT_SHA}\`) built on ${BUILD_DATE}.

          ### Sideloading on iPhone / iPad (iOS 26.0+)
          1. Download \`HengeLinux-unsigned.ipa\` directly on your iOS device and sign/install with **SideStore** or **AltStore** (no local Mac required).
          2. Download the pre-built guest files (\`archlinux.hvsparse\`, \`code.fd\`, and \`vars.fd\`) attached to this release (or build locally with \`scripts/provision_archlinux_arm64.sh\`).
          3. In **HengeLinux**, tap **Import Guest Files (hvsparse / code.fd / vars.fd)...** (and optionally **Import pairing.plist...** for in-app TXM JIT).
          4. Default Arch Linux ARM credentials: \`root\` / \`root\` (and \`alarm\` / \`alarm\`)."
          if gh release view latest-ipa >/dev/null 2>&1; then
            gh release upload latest-ipa \
              build/HengeLinux-unsigned.ipa \
              build/HengeLinux-unsigned.ipa.sha256 \
              --clobber
            gh release edit latest-ipa \
              --title "HengeLinux Unsigned IPA (Latest main — ${SHORT_SHA})" \
              --notes "$NOTES" \
              --target main \
              --prerelease
          else
            gh release create latest-ipa \
              build/HengeLinux-unsigned.ipa \
              build/HengeLinux-unsigned.ipa.sha256 \
              --title "HengeLinux Unsigned IPA (Latest main — ${SHORT_SHA})" \
              --notes "$NOTES" \
              --target main \
              --prerelease
          fi
