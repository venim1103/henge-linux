name: Tag Pre-Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish as a GitHub Pre-Release (e.g. v0.2.3)'
        required: true
        default: 'v0.2.3'
        type: string

concurrency:
  group: release-tag-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  core-tests:
    name: Core & Platform Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host test dependencies (libzstd-dev, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzstd-dev pkg-config
      - name: Run 4 KiB TLB compatibility tests & build hvsparse
        run: make HV_TLB_PAGE_BITS=12 test-core hvsparse
      - name: Verify hvsparse pack/unpack round-trip
        run: |
          python3 -c '
          data = b"\x00" * 65536 + b"ARCH_LINUX_AARCH64" + b"\x00" * (131072 - 18) + b"\xff" * 4096
          open("build/raw.bin", "wb").write(data)
          '
          ./build/hvsparse pack build/raw.bin build/test.hvsparse
          ./build/hvsparse unpack build/test.hvsparse build/unpacked.bin
          cmp build/raw.bin build/unpacked.bin
      - name: Run 16 KiB TLB fast-path tests
        run: make clean && make HV_TLB_PAGE_BITS=14 test-core hvsparse
      - name: Validate guest C console & scripts
        run: |
          gcc -O2 -Wall -Wextra -Werror guest/henge_dual_console.c -o build/henge-dual-console
          python3 -m py_compile guest/henge-xdg-open scripts/apply_upstream_patches.py
          bash -n guest/setup-arch-bridge.sh
          bash -n scripts/sync_upstream.sh
          bash -n scripts/build_ios_deps.sh
          bash -n scripts/provision_archlinux_arm64.sh
          bash -n scripts/build_prebuilt_archlinux_arm64.sh
          bash scripts/build_prebuilt_archlinux_arm64.sh --dry-run

  guest-agent-arm64:
    name: Build Static ARM64 musl Guest Agent
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build static aarch64-linux-musl henge-guest-agent
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
          mkdir -p build/musl-uapi build/guest-tools
          ln -sfn /usr/include/linux build/musl-uapi/linux
          ln -sfn /usr/include/asm-generic build/musl-uapi/asm-generic
          ln -sfn "/usr/include/$(uname -m)-linux-gnu/asm" build/musl-uapi/asm
          musl-gcc -O2 -Wall -Wextra -Werror -static -isystem build/musl-uapi guest/henge_guest_agent.c -o build/guest-tools/henge-guest-agent
          strip build/guest-tools/henge-guest-agent
          file build/guest-tools/henge-guest-agent | grep -qi "aarch64"
          ./build/guest-tools/henge-guest-agent --version
      - name: Upload static ARM64 guest agent artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-guest-agent-arm64
          path: build/guest-tools/henge-guest-agent

  ios-build:
    name: Build Unsigned iOS IPA (macOS)
    needs: [guest-agent-arm64]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download static ARM64 guest agent into app bundle resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guest-agent-arm64
          path: ios/Resources
      - name: Select Xcode 26 toolchain if installed
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version | tee .xcode-version
      - name: Install XcodeGen & iOS static dependency build tools
        run: |
          brew install xcodegen meson ninja pkg-config
          brew list --versions xcodegen meson ninja pkg-config
      - name: Sync & patch upstream WindowsiOS engine
        run: bash scripts/sync_upstream.sh
      - name: Restore cached iOS static dependencies (libffi, glib, libslirp)
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # @actions/cache 6.2.0
        with:
          path: .upstream/WindowsiOS/ios/deps
          key: ios-arm64-deps-ios18-${{ runner.os }}-${{ hashFiles('.xcode-version', 'scripts/sync_upstream.sh', 'scripts/build_ios_deps.sh') }}
      - name: Build or validate iOS static dependencies (libffi, glib, libslirp)
        run: IOS_MIN_VERSION=18.0 bash scripts/build_ios_deps.sh
      - name: Run macOS platform tests & build full ios-lib
        run: make REQUIRE_UPSTREAM=1 IOS_MIN_VERSION=18.0 test-core hvsparse ios-lib
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned iphoneos bundle and package .ipa
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          xcodebuild \
            -project ios/HengeLinux.xcodeproj \
            -scheme HengeLinux \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            HENGE_GIT_COMMIT="$SHORT_SHA" \
            HENGE_BUILD_CHANNEL="Release (${RELEASE_TAG})" \
            HENGE_BUILD_DATE="$BUILD_DATE" \
            build
          APP_BUNDLE="build/DerivedData/Build/Products/Release-iphoneos/HengeLinux.app"
          otool -l "$APP_BUNDLE/HengeLinux" | grep -A 3 "LC_BUILD_VERSION" | grep -q "minos 18.0" || {
            echo "ERROR: Expected LC_BUILD_VERSION minos 18.0 in HengeLinux binary!" >&2
            exit 1
          }
          codesign --force --sign - --entitlements ios/JITExtension/HengeLinuxJITExtension.entitlements "$APP_BUNDLE/PlugIns/HengeLinuxJITExtension.appex"
          codesign --force --sign - --entitlements ios/HengeLinux.entitlements "$APP_BUNDLE"
          mkdir -p build/ipa/Payload
          cp -R "$APP_BUNDLE" build/ipa/Payload/
          (cd build/ipa && zip -qr ../HengeLinux-unsigned.ipa Payload)
          shasum -a 256 build/HengeLinux-unsigned.ipa > build/HengeLinux-unsigned.ipa.sha256
          ls -lh build/HengeLinux-unsigned.ipa
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ipa-assets
          path: |
            build/HengeLinux-unsigned.ipa
            build/HengeLinux-unsigned.ipa.sha256

  guest-image:
    name: Build Arch Linux ARM64 Guest Image & EDK2 Firmware
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install disk & UEFI provisioning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dosfstools \
            e2fsprogs \
            fdisk \
            gdisk \
            ipxe-qemu \
            libarchive-tools \
            mount \
            mtools \
            parted \
            qemu-efi-aarch64 \
            qemu-system-aarch64 \
            qemu-system-arm \
            systemd-boot-efi \
            tar \
            util-linux \
            xz-utils \
            zstd
      - name: Build code.fd, vars.fd, and archlinux.hvsparse
        env:
          VERIFY_BOOT: "1"
        run: bash scripts/build_prebuilt_archlinux_arm64.sh
      - name: Upload prebuilt guest image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-guest-assets
          path: |
            build/prebuilt/code.fd
            build/prebuilt/vars.fd
            build/prebuilt/archlinux.hvsparse
            build/prebuilt/SHA256SUMS.txt

  publish-prerelease:
    name: Publish GitHub Pre-Release
    needs: [core-tests, ios-build, guest-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download iOS IPA assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ipa-assets
          path: build/release
      - name: Download guest image assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guest-assets
          path: build/release
      - name: Create or update GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid release tag '$RELEASE_TAG' (expected vX.Y.Z)." >&2
            exit 1
          fi
          cp ios/Resources/henge-jit.js build/release/henge-jit.js
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="## HengeLinux ${RELEASE_TAG} (Pre-Release)

          Built from commit \`${SHORT_SHA}\` on ${BUILD_DATE}. Full-system ARM64 (\`aarch64\`) multi-distro Linux virtualization on non-jailbroken iOS 18.0 – iOS 27+ devices without \`Hypervisor.framework\`.

          ### Highlights
          - **2D VirtIO-GPU KMS Handoff & Hardware Cursor Overlay:** Added \`henge_virtio_gpu_reset()\` on VirtIO \`status=0\` reset (fixing black screens during UEFI-to-Linux handoff while preserving \`ramfb\` fallback) and alpha-blended \`cursorq\` (\`UPDATE_CURSOR\` / \`MOVE_CURSOR\`) compositing onto scanout 0 so the mouse pointer renders cleanly in Xorg \`modesetting\` and Wayland.
          - **Keyboard Dismiss, Compact Keyboard+Mouse Layout & Holdable Mouse Controls:** Replaced SwiftUI automatic keyboard safe-area tracking with explicit \`keyboardHeight\` padding + a dedicated \`SoftwareKeyboardInputProxyView\` so hiding the software keyboard immediately restores the full canvas; added compact Split Deck sizing when keyboard + trackpad are open together, holdable **Left / Right Click** buttons for trackpad dragging, 1-finger press-and-hold left-drag on the Display canvas, and 2-finger long-press context menu.
          - **No Doubled Keystrokes & Working \`Ctrl+Alt+F1\`–\`F12\` VT Switching:** Routed Arch \`henge_dual_console\` HID exclusively over PL011/\`OSC 9999\` (eliminating doubled characters on \`tty1\` and \`tty2\`), emitted synchronous key-down + \`60 ms\` sticky modifier release on special keys, and pulsed \`Ctrl+Alt+F1..F12\` chords onto \`virtio-input\` so VT switching works reliably across distros.
          - **Always-Active \`ttyAMA0\` Serial Terminal on VT2+ (V2 Bridge):** Upgraded \`henge-dual-console\` / \`henge-guest-agent\` to \`HENGE_HID_READY_V2\` (\`OSC 9999;T\` tty1-scoped text) so the **\`ttyAMA0\` Serial Terminal** tab continues accepting root commands even while LXQt/SDDM is active on \`vt2\`.
          - **Apple Silicon Inline Timer Fast-Path:** Validated Darwin \`COMMPAGE_TIMEBASE_TYPE == 3\` (\`S3_4_C15_C10_6\`) and \`type == 2\` (\`CNTVCTSS_EL0\`) in \`translate_counter()\` so iPhones stay on fast inline \`CNTVCT_EL0\` JIT emission instead of falling back to \`hv_counter()\`.

          ### Quick Setup (iOS 18.0+)
          1. Download and sign **\`HengeLinux-unsigned.ipa\`** with **SideStore** or **AltStore**.
          2. Download **\`code.fd\`**, **\`vars.fd\`**, and either **\`archlinux.hvsparse\`** or any official ARM64 cloud \`.qcow2\` / Live \`.iso\`, then import via **Import Guest Files...** inside HengeLinux.
          3. Enable **LocalDevVPN** and tap **Enable JIT via StikDebug** inside HengeLinux (on iOS 26+ TXM, stock \`universal.js\` or \`henge-jit.js\` works out of the box).
          4. Tap **Boot**. See [\`docs/SETUP.md\`](https://github.com/venim1103/henge-linux/blob/${RELEASE_TAG}/docs/SETUP.md) for full instructions."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              build/release/HengeLinux-unsigned.ipa \
              build/release/HengeLinux-unsigned.ipa.sha256 \
              build/release/archlinux.hvsparse \
              build/release/code.fd \
              build/release/vars.fd \
              build/release/SHA256SUMS.txt \
              build/release/henge-jit.js \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "HengeLinux ${RELEASE_TAG} (Pre-Release)" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              build/release/HengeLinux-unsigned.ipa \
              build/release/HengeLinux-unsigned.ipa.sha256 \
              build/release/archlinux.hvsparse \
              build/release/code.fd \
              build/release/vars.fd \
              build/release/SHA256SUMS.txt \
              build/release/henge-jit.js \
              --title "HengeLinux ${RELEASE_TAG} (Pre-Release)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
